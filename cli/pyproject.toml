[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "photosphere"
version = "0.1.0"
description = "Photosphere v3 local media ingestion, hashing, deduplication, AI labeling, and dual-bucket GCS sync CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "av>=13.0.0",
    "click>=8.1.8",
    "google-cloud-storage>=2.19.0",
    "imagehash>=4.3.2",
    "pillow>=11.0.0",
    "pillow-heif>=0.21.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "rich>=13.9.0",
    "structlog>=25.1.0",
    "tqdm>=4.67.0",
]

[project.optional-dependencies]
ai = [
    "einops>=0.8.0",
    "sacremoses>=0.1.1",
    "sentencepiece>=0.2.0",
    "torch>=2.5.0",
    "transformers>=4.47.0,<6.0.0",
]

[project.scripts]
photosphere = "photosphere.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/photosphere"]

[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = ["src", ".."]
testpaths = ["tests", "../scripts"]
markers = [
    "integration: end-to-end tests requiring fake-gcs-server emulator",
]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
mypy_path = ["src", ".."]

[[tool.mypy.overrides]]
module = [
    "av",
    "av.*",
    "google.api_core.*",
    "google.cloud.*",
    "imagehash",
    "jsonschema",
    "pillow_heif",
    "pillow_heif.*",
    "tqdm",
    "tqdm.*",
]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "jsonschema>=4.23.0",
    "mypy>=1.14.0",
    "pyright>=1.1.390",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
]
